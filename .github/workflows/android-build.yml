name: Android APK

on:
  push:
    branches: [master, mobile-apk-and-features]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Do NOT rely on `sdkmanager` being on PATH (it often is not, and the
      # preinstalled SDK layout varies between runner images). Resolve it
      # explicitly under ANDROID_SDK_ROOT, installing cmdline-tools if missing.
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found, installing cmdline-tools..."
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "--- installed packages ---"
          ls "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_SDK_ROOT/platforms"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build C# assembly
        run: dotnet build Rhythia.csproj -c Release

      - name: Create debug keystore and editor settings
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          # Godot 4 uses a .tres editor settings file (not XML).
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          config_version=5

          [export]

          android/java_sdk_path="$JAVA_HOME"
          android/android_sdk_path="$ANDROID_SDK_ROOT"
          android/debug_keystore_file="$GITHUB_WORKSPACE/debug.keystore"
          android/debug_keystore_user="androiddebugkey"
          android/debug_keystore_pass="android"
          EOF

      # Import the project first — a headless export fails with exit code 1
      # if the .godot import cache doesn't exist yet.
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --import --verbose 2>&1 | tee godot-import.log
          echo "--- .godot cache ---"
          ls -la .godot || echo "WARNING: .godot cache missing after import!"

      - name: Export Android APK
        run: |
          set -o pipefail
          mkdir -p builds/android
          godot --headless --export-debug --verbose "Android" builds/android/Rhythia.apk 2>&1 | tee godot-export.log

      # Always capture Godot's full stdout/stderr so failures are debuggable.
      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            godot-import.log
            godot-export.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythia-android-apk
          path: builds/android/Rhythia.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/android/Rhythia.apk
