name: Android APK

on:
  push:
    branches: [master, mobile-apk-and-features]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found, installing cmdline-tools..."
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "--- installed packages ---"
          ls "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_SDK_ROOT/platforms"

      # The project uses C#, so the .NET (mono) editor build is required.
      - name: Download Godot (mono)
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64 /usr/local/share/godot-mono
          sudo ln -sf /usr/local/share/godot-mono/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 /usr/local/bin/godot

      - name: Download Godot export templates (mono)
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          # Mono templates live under export_templates/<version>.stable.mono/
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$TEMPLATE_DIR"
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TEMPLATE_DIR/"
          echo "--- templates ---"
          ls "$TEMPLATE_DIR"

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build C# assembly
        run: dotnet build Rhythia.csproj -c Release

      - name: Create debug keystore and editor settings
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          # Editor settings use a [resource] section with export/android/* keys.
          # Written with printf so no leading indentation corrupts the file.
          mkdir -p ~/.config/godot
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/java_sdk_path = "'"$JAVA_HOME"'"' \
            'export/android/android_sdk_path = "'"$ANDROID_SDK_ROOT"'"' \
            'export/android/debug_keystore = "'"$GITHUB_WORKSPACE"'/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > ~/.config/godot/editor_settings-4.7.tres
          echo "--- editor settings ---"
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Import project
        run: |
          set -o pipefail
          godot --headless --import --verbose 2>&1 | tee godot-import.log || true
          echo "--- .godot cache ---"
          ls -la .godot || echo "WARNING: .godot cache missing after import!"

      - name: Export Android APK
        run: |
          set -o pipefail
          mkdir -p builds/android
          godot --headless --export-debug --verbose "Android" builds/android/Rhythia.apk 2>&1 | tee godot-export.log

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            godot-import.log
            godot-export.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythia-android-apk
          path: builds/android/Rhythia.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/android/Rhythia.apk
