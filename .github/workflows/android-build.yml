name: Android APK

on:
  push:
    branches: [master, mobile-apk-and-features]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv /tmp/clt/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"
          "$SDKMANAGER" --list_installed

      - name: Download Godot (mono)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN=$(find /tmp/godot -type f -name 'Godot_v*mono_linux.x86_64' | head -n 1)
          test -n "$GODOT_BIN"
          sudo mv "$GODOT_BIN" /usr/local/bin/godot
          sudo cp -r "$(dirname "$GODOT_BIN")/GodotSharp" /usr/local/bin/GodotSharp
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Download Godot export templates (mono)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$TEMPLATE_DIR"
          mv /tmp/templates/templates/* "$TEMPLATE_DIR/"

      - name: Create debug keystore and editor settings
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/android_sdk_path = "/usr/local/lib/android/sdk"' \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            'export/android/debug_keystore = "/home/runner/.android/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > ~/.config/godot/editor_settings-4.7.tres

      - name: Restore Android C# dependencies
        run: dotnet restore Rhythia.csproj -p:GodotTargetPlatform=android

      - name: Build Android C# assembly
        run: dotnet build Rhythia.csproj -c Release --no-restore -p:GodotTargetPlatform=android

      - name: Import project
        run: godot --headless --import --verbose 2>&1 | tee godot-import.log

      - name: Export Android APK
        run: |
          set -o pipefail
          mkdir -p builds/android
          godot --headless --export-debug --verbose "Android" builds/android/Rhythia.apk 2>&1 | tee godot-export.log

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            godot-import.log
            godot-export.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythia-android-apk
          path: builds/android/Rhythia.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/android/Rhythia.apk
