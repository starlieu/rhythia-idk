name: Android APK

on:
  push:
    branches: [master, mobile-apk-and-features]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build C# assembly
        run: dotnet build Rhythia.csproj -c Release

      - name: Create debug keystore and editor settings
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <editor_settings>
            <setting name="export/android/java_sdk_path" value="$JAVA_HOME"></setting>
            <setting name="export/android/android_sdk_path" value="$ANDROID_HOME"></setting>
            <setting name="export/android/debug_keystore_file" value="$GITHUB_WORKSPACE/debug.keystore"></setting>
            <setting name="export/android/debug_keystore_user" value="androiddebugkey"></setting>
            <setting name="export/android/debug_keystore_pass" value="android"></setting>
          </editor_settings>
          EOF

      - name: Export Android APK
        run: godot --headless --export-debug "Android" builds/android/Rhythia.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythia-android-apk
          path: builds/android/Rhythia.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/android/Rhythia.apk
