name: Android APK

on:
  push:
    branches: [master, mobile-apk-and-features]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: we do NOT use android-actions/setup-android here.
      # The Android SDK is already preinstalled on GitHub ubuntu runners
      # at /usr/local/lib/android/sdk. We only ensure the required
      # packages are present and licenses are accepted.
      - name: Prepare Android SDK (preinstalled)
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build C# assembly
        run: dotnet build Rhythia.csproj -c Release

      - name: Create debug keystore and editor settings
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          # Godot 4 uses a .tres editor settings file (not XML).
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          config_version=5

          [export]

          android/java_sdk_path="$JAVA_HOME"
          android/android_sdk_path="$ANDROID_SDK_ROOT"
          android/debug_keystore_file="$GITHUB_WORKSPACE/debug.keystore"
          android/debug_keystore_user="androiddebugkey"
          android/debug_keystore_pass="android"
          EOF

      - name: Export Android APK
        run: godot --headless --export-debug "Android" builds/android/Rhythia.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythia-android-apk
          path: builds/android/Rhythia.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/android/Rhythia.apk
